# Historical direct-sweep regression fixture; not the current vehicle configuration.
gimbal_controller:
  ros__parameters:
    yaw_control_enabled: false
    identification_hold: true
    upper_limit: -0.6
    lower_limit: 0.1
    ctrl_hold_pitch_target_angle: 0.0
    yaw_angle_kp: 10.0
    yaw_angle_ki: 0.0
    yaw_angle_kd: 0.0
    yaw_velocity_kp: 13.0
    yaw_velocity_ki: 0.02
    yaw_velocity_kd: 0.0
    yaw_velocity_integral_min: -5.0
    yaw_velocity_integral_max: 5.0
    pitch_angle_kp: 35.0
    pitch_angle_ki: 0.02
    pitch_angle_kd: 0.3
    pitch_angle_integral_min: -0.5
    pitch_angle_integral_max: 0.5
    pitch_velocity_kp: 2.0
    pitch_velocity_ki: 0.0
    pitch_velocity_kd: 0.0
    yaw_ref_velocity_gain: 1.0
    pitch_ref_velocity_gain: 1.0
    yaw_velocity_ff_gain: 0.13
    yaw_acceleration_ff_gain: 0.18
    pitch_velocity_ff_gain: 0.378
    pitch_acceleration_ff_gain: 0.0396
    pitch_gravity_ff_gain: 2.575
    pitch_gravity_ff_phase: 1.784
    pitch_torque_control: true
chassis_controller:
  ros__parameters:
    always_disabled: true
    min_angle: 8.0
    max_angle: 59.0
    active_suspension_enable: true
    wireless_charging_offset_deg: 135.0
    wireless_charging_speed_limit: 0.6
    wireless_charging_angular_velocity_limit: 10.0
yaw_swept_frequency_controller:
  ros__parameters:
    target: /gimbal/yaw
    direct_torque_test: true
    sweep: true
    pid: false
    dc_offset: 0.0
    logarithmic: true
    start_freq: 0.5
    end_freq: 1.5
    duration: 60.0
    amplitude: 0.8
    torque_limit: 0.8
    velocity_limit: 1.5707963267948966
