# All positions/rates refer to gearbox-output radians, not launcher angles.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::Gantry -> gantry_hardware
      - rmcs_core::controller::gantry::GantryController -> gantry_controller

gantry_hardware:
  ros__parameters:
    board_serial: ""
    feedback_timeout_ms: 100
    torque_limit: 0.20

gantry_controller:
  ros__parameters:
    deadzone: 0.08
    pitch_sign: 1.0
    yaw_sign: -1.0
    lift_rate: 1.0
    yaw_rate: 1.0
    # 0.2 rad tracking window * 6 = 1.2 rad/s; allows 1 rad/s tracking.
    position_kp: 6.0
    sync_kp: 2.0
    max_velocity: 1.2
    max_skew: 0.3
    velocity_kp: 0.4
    torque_limit: 0.20
